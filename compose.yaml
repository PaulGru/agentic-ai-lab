services:
  lab:
    build: .
    volumes:
      - agentic_state:/app/data
  
  api:
    build: .
    entrypoint:
      - python
      - -m
      - uvicorn
      - api_v61:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "postgresql://lab:${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}@db:5432/agentic_lab"
      LANGGRAPH_STRICT_MSGPACK: "true"
      AGENTIC_API_KEY: "${AGENTIC_API_KEY:?Missing AGENTIC_API_KEY}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - agentic_state:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
      POSTGRES_DB: agentic_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d agentic_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


volumes:
  agentic_state:
  postgres_data:

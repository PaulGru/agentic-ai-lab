name: Agentic AI Lab - CI

on:
  push:
    branches: [main, 'feat/v8.6-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    env:
      # Identifiants factices, uniquement pour cette CI isolée
      POSTGRES_PASSWORD: ci_only_postgres_password_12345
      AGENTIC_API_KEY: ci_only_demo_key_for_agentic_lab_testing_123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build --wait -d api

      - name: Run existing unit tests
        run: |
          docker compose run --rm \
            --entrypoint python lab \
            -m unittest discover -s /app/tests -v

      - name: Run HTTP integration tests
        run: |
          docker compose exec -T api \
            python /app/scripts/smoke_v54.py
      
      - name: Run research HTTP contract tests
        run: |
          docker compose exec -T api \
            python /app/scripts/smoke_v67.py

      - name: Verify V8.6 PostgreSQL restart across processes
        run: |
          docker compose exec -T api \
            python -m scripts.check_v86_postgres
            
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Cleanup CI containers
        if: always()
        run: docker compose down -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline contracts, workflows and CLI tests on Windows
        run: python -m unittest discover -s tests -v
